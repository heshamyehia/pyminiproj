name: CI/CD Pipeline
on:
  workflow_dispatch:
  push:
    branches:
    - cicd-agent/auto-update
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install ruff
      run: pip install ruff
    - name: Check formatting
      run: ruff format --check --exclude tests .
    - name: Lint
      run: ruff check --output-format=github --extend-exclude tests .
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Run pytest
      run: python -m pytest tests/ -v
